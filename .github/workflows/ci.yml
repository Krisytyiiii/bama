name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: API (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Prisma 7 and some test suites construct clients at load time and only
      # require the variable to be present (no connection is made in CI).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zentra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Build shared packages
        run: |
          (cd packages/domain && npm ci && npm run build)
          (cd packages/contracts && npm ci && npm run build)
      - run: npx prisma generate
      # NOTE: `prisma migrate deploy` was removed here on 2026-11-18.
      #
      # It cannot work against this database: no migration creates
      # "StudentRoster" (only ALTER TABLE does), so a fresh DB dies at
      # 20260911100000_attendance_roster_support with 42P01, and the live DB
      # has no "_prisma_migrations" history at all (it was built with
      # `prisma db push`). Auto-applying was also running unreviewed DDL
      # against production on every push to main.
      #
      # Migrations are applied by hand, per PLANS/supabase-egress-recovery.md
      # §4.2b: `prisma migrate diff --from-empty --to-schema` for a fresh
      # bootstrap, or `--from-schema-datamodel`/`--to-schema` for a delta.
      # See AGENTS.md (Gotchas) before re-enabling this step.
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build

  frontend:
    name: Web (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint
      - run: npm run build

  repo-checks:
    name: Repo (route inventory + arch + metrics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/route-inventory.mjs --check
      - run: node tools/arch-check.mjs
      - run: node tools/repo-metrics.mjs
